name = "bandicroc-niagaragrapes"
pages_build_output_dir = "dist"
compatibility_date = "2026-10-01"

# Workers AI: the chat function reaches the model through this binding, so no API key is needed.
[ai]
binding = "AI"

[vars]
# Which AI goes first: "workers-ai" (default, free daily allowance) or "openrouter".
# If the first one fails and the OPENROUTER_API_KEY secret is set, the other is tried automatically.
AI_PROVIDER = "workers-ai"
WORKERS_AI_MODEL = "@cf/meta/llama-4-scout-17b-16e-instruct"
# Backup model on OpenRouter. Must end in ":free"; paid models are refused (see server/grapeBot/settings.ts).
OPENROUTER_MODEL = "particle-ai/particle-1:free"

# Grape juice: each visitor's daily Grape Bot allowance (see server/grapeBot/juice.ts).
# The binding must be called DB: the code reads it as env.DB.
[[d1_databases]]
binding = "DB"
database_name = "grape-juice"
database_id = "d1c62b6e-d0b2-4340-b282-ffe70ef9c9a4"