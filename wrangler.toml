name = "bandicroc-niagaragrapes"
pages_build_output_dir = "dist"
compatibility_date = "2026-10-01"

# Workers AI: the chat function reaches the model through this binding, so no API key is needed.
[ai]
binding = "AI"

[vars]
# "workers-ai" (default, free daily allowance) or "openrouter" (backup; needs the OPENROUTER_API_KEY secret)
AI_PROVIDER = "workers-ai"
WORKERS_AI_MODEL = "@cf/meta/llama-3.1-8b-instruct"
OPENROUTER_MODEL = "meta-llama/llama-3.3-70b-instruct:free"
